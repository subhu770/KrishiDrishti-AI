# =========================================================================
# Nginx Reverse Proxy Configuration Template with Let's Encrypt / SSL
# =========================================================================
# 
# BOOTSTRAPPING INSTRUCTIONS FOR NEW DEPLOYMENTS:
# 1. Temporarily comment out the entire 'server' block listening on port 443.
# 2. Run: docker-compose up -d nginx
# 3. Request your SSL certificate via Certbot:
#    docker run -it --rm --name certbot \
#      -v "krishidrishti_certbot_conf:/etc/letsencrypt" \
#      -v "krishidrishti_certbot_www:/var/www/certbot" \
#      certbot/certbot certonly --webroot \
#      -w /var/www/certbot -d yourdomain.com -d www.yourdomain.com \
#      --email admin@yourdomain.com --agree-tos --no-eff-email
# 4. Uncomment the port 443 'server' block below.
# 5. Reload Nginx: docker-compose exec nginx nginx -s reload
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # <-- REPLACE with your domain name

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt / Certbot verification challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com; # <-- REPLACE with your domain name

    # SSL Certificate Configuration (Certbot paths)
    # <-- REPLACE 'yourdomain.com' with your actual domain folder name
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern and Strong SSL Parameters (A+ Rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Proxy configuration for FastAPI / Gunicorn backend service
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for Uvicorn if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings for long-running ML model inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;

        # Max upload size for leaf images (10MB limit)
        client_max_body_size 10M;
    }

    # Highly optimized static files serving (serves files directly from mounted volume)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
